name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request: {}

permissions:
  contents: read

jobs:
  lints:
    name: Code lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    needs: [lints]
    name: Test python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', 'pypy3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-dev --group test
      - run: uv run --no-sync pytest --cov --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  build-deploy:
    name: Build & deploy
    needs: [lints, tests]
    if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # required for PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish
