[project]
name = "python-mediator"
version = "0.7.0"
description = "Python mediator bus microframework for CQRS + ES"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Damian Łukawski", email = "damian@lukawscy.pl" }]
requires-python = ">=3.11"
keywords = ["mediator", "cqrs", "event-driven", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dlski/python-mediator"
Repository = "https://github.com/dlski/python-mediator"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["mypy>=1.18", "ruff>=0.14"]
test = ["pytest>=8.4", "pytest-asyncio>=1.2", "pytest-cov>=7.0"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mediator"

[tool.pytest.ini_options]
testpaths = ["tests", "example"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["mediator"]

[tool.coverage.report]
precision = 2
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
